<ng-container *ngIf="clienti.length > 0">
  <mat-card *ngFor="let cliente of clienti" class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title>Shiba Inu</mat-card-title>
        <mat-card-subtitle>Small</mat-card-subtitle>
        <img mat-card-sm-image src="https://material.angular.io/assets/img/examples/shiba2.jpg" />
      </mat-card-title-group>
    </mat-card-header>
    <mat-card-content> </mat-card-content>
  </mat-card>
</ng-container>
<p *ngIf="cliente">PORCO DIO</p>
